[package]
name = "cyclops"
version = "0.1.0"
edition = "2021"
description = "A blazing-fast, GPU-accelerated image browser with a modern glass UI"
license = "MIT OR Apache-2.0"
repository = "https://github.com/subtilicus/cyclops"
readme = "README.md"
keywords = ["image", "viewer", "browser", "gpu", "wgpu"]
categories = ["multimedia::images", "graphics"]

[dependencies]
bcdec_rs = "0.2.0"
bytemuck = { version = "1.25.2", features = ["derive", "extern_crate_alloc"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
crossbeam-channel = "0.5.17"
ddsfile = "0.6.0"
eframe = { version = "0.37.0", default-features = false, features = ["wgpu", "default_fonts", "persistence"] }
egui = "0.37"
half = "2.7.1"
image = { version = "0.25.10", default-features = false, features = ["png", "gif", "bmp", "webp", "tiff", "rayon", "ico", "tga", "dds", "hdr", "exr", "qoi", "pnm"] }
ktx2 = "0.5.0"
log = "0.4.34"
psd = "0.3.5"
raw-window-handle = "0.6"
rayon = "1.12.0"
resvg = "0.48.1"
ruzstd = "0.9.1"
texture2ddecoder = "0.1.2"
zune-core = "0.5.3"
zune-jpeg = "0.5.15"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Keep decoders fast even in debug builds.
[profile.dev.package."*"]
opt-level = 3

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dwm", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_Graphics_Imaging", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_SystemServices", "Win32_UI_Controls", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }
windows-core = "0.62"

[build-dependencies]
cc = "1.9.0"
