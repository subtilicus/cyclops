[package]
name = "cyclops"
version = "0.1.0"
edition = "2021"
description = "A blazing-fast, GPU-accelerated image browser with a modern glass UI"
license = "MIT OR Apache-2.0"
repository = "https://github.com/subtilicus/cyclops"
readme = "README.md"
keywords = ["image", "viewer", "browser", "gpu", "wgpu"]
categories = ["multimedia::images", "graphics"]

[dependencies]
crossbeam-channel = "0.5.17"
eframe = { version = "0.37.0", default-features = false, features = ["wgpu", "default_fonts", "persistence"] }
egui = "0.37"
image = { version = "0.25.10", default-features = false, features = ["png", "gif", "bmp", "webp", "tiff", "rayon"] }
zune-core = "0.5.3"
zune-jpeg = "0.5.15"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Keep decoders fast even in debug builds.
[profile.dev.package."*"]
opt-level = 3
